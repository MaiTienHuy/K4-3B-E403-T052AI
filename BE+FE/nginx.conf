events {
    worker_connections 1024;
}

http {
    # Extract the real client IP from Cloudflare's header
    # If the header is missing, fall back to the remote address
    map $http_cf_connecting_ip $real_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # Define a rate limit zone based on the real client IP.
    # Zone name: req_limit_per_ip
    # Size: 10m (can hold state for ~160,000 IP addresses)
    # Rate: 20 requests per second (Streamlit loads many static files initially)
    limit_req_zone $real_client_ip zone=req_limit_per_ip:10m rate=20r/s;

    server {
        listen 80;

        location / {
            # Apply the rate limit
            # burst=100 allows spikes of up to 100 requests without error (for static files)
            # nodelay means it will reject immediately if burst is exceeded instead of queueing
            limit_req zone=req_limit_per_ip burst=100 nodelay;

            # Streamlit requires WebSockets support
            proxy_pass http://app:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            return 200 "healthy\n";
        }
    }
}
